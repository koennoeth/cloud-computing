apiVersion: apps/v1
kind: Deployment
metadata:
  name: storingsmelder
  labels:
    app: storingsmelder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storingsmelder
  template:
    metadata:
      labels:
        app: storingsmelder
    spec:
      containers:
      - name: storingsmelder
        image: ghcr.io/koennoeth/storingsmelder:1.0
        ports:
        - containerPort: 8000
