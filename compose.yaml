services: 
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - volumeke:/data
    environment:
      DATABASE_URL: postgresql://postgres:kenneth@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: kenneth
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  volumeke:
  postgres_data: